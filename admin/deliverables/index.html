<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEREON Deliverables</title>
<style>body{font-family:system-ui;background:#071017;color:#eef8ff;max-width:980px;margin:auto;padding:32px}input,textarea,button{font:inherit;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #29404f;background:#0b1720;color:#eef8ff}button{background:#3be7ff;color:#031018;font-weight:800;cursor:pointer}.muted{opacity:.65}.card{background:#101b22;border:1px solid #22313b;border-radius:16px;padding:18px;margin:14px 0}label{display:block;margin-top:8px;font-weight:700}.fine{font-size:12px;opacity:.65}</style></head>
<body><h1>NEREON Deliverables</h1><p class="muted">Upload project outputs to Cloudflare R2.</p>
<div class="card"><label>Project ID</label><input id="pid" placeholder="Project ID"><label>Title</label><input id="title" placeholder="Final automation report"><label>Description</label><textarea id="desc" placeholder="What is included"></textarea><label>File</label><input id="file" type="file"><div class="fine">Maximum file size: 25 MB.</div><button id="upload">Upload deliverable</button><div id="state"></div></div>
<script>
const tok=localStorage.getItem('nereon_admin_token')||'';
const q=new URLSearchParams(location.search);if(q.get('project_id'))document.getElementById('pid').value=q.get('project_id');
document.getElementById('upload').onclick=async()=>{const pid=document.getElementById('pid').value.trim(),title=document.getElementById('title').value.trim(),desc=document.getElementById('desc').value,file=document.getElementById('file').files[0];if(!pid||!title||!file){document.getElementById('state').textContent='Project ID, title and file are required.';return}if(file.size>25*1024*1024){document.getElementById('state').textContent='File is larger than 25 MB.';return}const fd=new FormData();fd.append('project_id',pid);fd.append('title',title);fd.append('description',desc);fd.append('file',file,file.name);document.getElementById('state').textContent='Uploading…';const r=await fetch('/api/admin/upload-deliverable',{method:'POST',headers:{'Authorization':'Bearer '+tok},body:fd});const d=await r.json();document.getElementById('state').textContent=r.ok?'Uploaded successfully.':(d.error||'Upload failed.');if(r.ok){document.getElementById('title').value='';document.getElementById('desc').value='';document.getElementById('file').value='';}};
</script></body></html>
