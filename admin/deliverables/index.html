<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEREON Deliverables</title><style>
body{font-family:system-ui;background:#071017;color:#eef8ff;max-width:980px;margin:auto;padding:32px}input,textarea,button,select{font:inherit;padding:10px;margin:5px 0;border-radius:10px;border:1px solid #29404f;background:#0b1720;color:#eef8ff}button{background:#3be7ff;color:#031018;font-weight:800;cursor:pointer}.muted{opacity:.65}.row{display:flex;gap:8px;flex-wrap:wrap}.card{background:#101b22;border:1px solid #22313b;border-radius:16px;padding:18px;margin:14px 0}</style></head><body><h1>NEREON Deliverables</h1><p class="muted">Project deliverables control.</p><div class="card"><input id="pid" placeholder="Project ID"><input id="title" placeholder="Deliverable title"><textarea id="desc" placeholder="Description"></textarea><input id="url" placeholder="Resource URL (optional)"><button id="add">Add deliverable</button><div id="state"></div></div><div id="list"></div><script>
const tok=localStorage.getItem('nereon_admin_token')||'';const headers={'Content-Type':'application/json','Authorization':'Bearer '+tok};const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const q=new URLSearchParams(location.search);if(q.get('project_id'))document.getElementById('pid').value=q.get('project_id');
async function load(){const pid=document.getElementById('pid').value.trim();if(!pid)return;const r=await fetch('/api/admin/deliverables?project_id='+encodeURIComponent(pid),{headers});const d=await r.json();document.getElementById('list').innerHTML=(d.deliverables||[]).map(x=>`<div class="card"><div class="row"><strong>${esc(x.title)}</strong><select data-id="${esc(x.id)}"><option value="pending" ${x.status==='pending'?'selected':''}>Pending</option><option value="in_progress" ${x.status==='in_progress'?'selected':''}>In progress</option><option value="ready" ${x.status==='ready'?'selected':''}>Ready</option><option value="delivered" ${x.status==='delivered'?'selected':''}>Delivered</option><option value="accepted" ${x.status==='accepted'?'selected':''}>Accepted</option><option value="blocked" ${x.status==='blocked'?'selected':''}>Blocked</option></select></div><p>${esc(x.description||'')}</p>${x.resource_url?`<a href="${esc(x.resource_url)}" target="_blank" rel="noopener">Open resource ↗</a>`:''}</div>`).join('')||'<p class="muted">No deliverables yet.</p>';document.querySelectorAll('select[data-id]').forEach(s=>s.onchange=async()=>{await fetch('/api/admin/deliverables?id='+encodeURIComponent(s.dataset.id),{method:'PATCH',headers,body:JSON.stringify({status:s.value})});load()})}
document.getElementById('add').onclick=async()=>{const project_id=document.getElementById('pid').value.trim(),title=document.getElementById('title').value.trim(),description=document.getElementById('desc').value,resource_url=document.getElementById('url').value.trim();if(!project_id||!title){document.getElementById('state').textContent='Project ID and title required.';return}const r=await fetch('/api/admin/deliverables',{method:'POST',headers,body:JSON.stringify({project_id,title,description,resource_url})});const d=await r.json();document.getElementById('state').textContent=r.ok?'Added.':(d.error||'Failed.');if(r.ok){document.getElementById('title').value='';document.getElementById('desc').value='';document.getElementById('url').value='';load()}};load();
</script></body></html>
