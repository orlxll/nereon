<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NEREON — Proposal</title><link rel="stylesheet" href="../css/brand.css"><style>
body{margin:0;background:#050b10;color:#eef8ff;font:15px/1.6 Inter,system-ui,sans-serif}.wrap{max-width:880px;margin:auto;padding:30px 20px 80px}.brand{letter-spacing:.18em;font-weight:800}.eyebrow{margin-top:60px;color:#3be7ff;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.card{margin-top:18px;padding:28px;border:1px solid #1a2b37;border-radius:24px;background:rgba(11,20,28,.9)}h1{font-size:clamp(40px,7vw,72px);line-height:.98;letter-spacing:-.05em;margin:8px 0 14px}h2{margin-top:32px}p{color:#a1b5c0}.meta{display:flex;gap:18px;flex-wrap:wrap;margin:20px 0;color:#9db0bb}.price{font-size:34px;color:#fff;font-weight:800}.scope li{margin:10px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}button,textarea{font:inherit;border-radius:14px;border:1px solid #28404e;background:#071018;color:#eef8ff;padding:12px 14px}button{cursor:pointer;background:#3be7ff;color:#031018;border-color:#3be7ff;font-weight:800}.ghost{background:transparent;color:#eef8ff}.hidden{display:none!important}.state{margin-top:16px;padding:14px;border-radius:14px;background:#08131b;border:1px solid #1a2b37}.error{color:#ff9ca5}textarea{width:100%;box-sizing:border-box;min-height:120px;margin-top:10px}.fine{font-size:12px;color:#748a96}@media(max-width:650px){.wrap{padding-inline:14px}.card{padding:20px}}
</style></head><body><div class="wrap"><div class="brand">NEREON</div><p class="eyebrow">PRIVATE CLIENT PORTAL</p><div id="app" class="card"><p>Loading proposal…</p></div></div><script>
(()=>{const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const token=new URLSearchParams(location.search).get('token')||'';if(!token){app.innerHTML='<h2>Invalid link</h2><p class="error">This proposal link is missing its secure token.</p>';return}
async function load(){const r=await fetch('/api/client/proposal?token='+encodeURIComponent(token));const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Could not load proposal.');render(d.proposal)}
function render(p){const items=Array.isArray(p.scope)?p.scope:[];app.innerHTML=`<div class="meta"><span>${esc(p.company)}</span><span>${esc(p.status)}</span><span>${esc(p.timeline)}</span></div><h1>${esc(p.title)}</h1><p>${esc(p.executive_summary)}</p><h2>Scope</h2><ol class="scope">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="meta"><span>Investment</span><span class="price">€${Number(p.price_eur||0).toLocaleString('de-DE')}</span></div>${p.client_message?`<div class="state"><strong>Latest client note</strong><p>${esc(p.client_message)}</p></div>`:''}<div id="actionArea">${p.status==='accepted'?'<div class="state">✅ Proposal accepted. Thank you — NEREON will follow up with next steps.</div>':p.status==='rejected'?'<div class="state">This proposal was rejected.</div>':`<label for="message"><strong>Message for NEREON</strong></label><textarea id="message" placeholder="Questions, requested changes, or context…"></textarea><div class="actions"><button id="accept">Accept proposal</button><button id="changes" class="ghost">Request changes</button></div><div id="state"></div>`}</div><p class="fine">This secure link is private. Do not share it publicly.</p>`;const accept=document.getElementById('accept');const changes=document.getElementById('changes');if(accept)accept.onclick=()=>send('accept');if(changes)changes.onclick=()=>send('request_changes')}
async function send(action){const message=(document.getElementById('message')?.value||'').trim();const state=document.getElementById('state');state.textContent='Submitting…';try{const r=await fetch('/api/client/proposal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action,message})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Request failed.');state.innerHTML='<div class="state">✅ '+esc(d.message||'Done.')+'</div>';await load()}catch(e){state.innerHTML='<div class="state error">'+esc(e.message)+'</div>'}}
load().catch(e=>{app.innerHTML='<h2>Proposal unavailable</h2><p class="error">'+esc(e.message)+'</p>'});})();</script></body></html>
