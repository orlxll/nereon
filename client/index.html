<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NEREON — Proposal</title><link rel="stylesheet" href="../css/brand.css"><style>
body{margin:0;background:#050b10;color:#eef8ff;font:15px/1.6 Inter,system-ui,sans-serif}.wrap{max-width:880px;margin:auto;padding:30px 20px 80px}.brand{letter-spacing:.18em;font-weight:800}.eyebrow{margin-top:60px;color:#3be7ff;font-size:11px;letter-spacing:.18em;text-transform:uppercase}.card{margin-top:18px;padding:28px;border:1px solid #1a2b37;border-radius:24px;background:rgba(11,20,28,.9)}h1{font-size:clamp(40px,7vw,72px);line-height:.98;letter-spacing:-.05em;margin:8px 0 14px}h2{margin-top:32px}p{color:#a1b5c0}.meta{display:flex;gap:18px;flex-wrap:wrap;margin:20px 0;color:#9db0bb}.price{font-size:34px;color:#fff;font-weight:800}.scope li{margin:10px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}button,textarea{font:inherit;border-radius:14px;border:1px solid #28404e;background:#071018;color:#eef8ff;padding:12px 14px}button{cursor:pointer;background:#3be7ff;color:#031018;border-color:#3be7ff;font-weight:800}.ghost{background:transparent;color:#eef8ff}.hidden{display:none!important}.state{margin-top:16px;padding:14px;border-radius:14px;background:#08131b;border:1px solid #1a2b37}.error{color:#ff9ca5}textarea{width:100%;box-sizing:border-box;min-height:120px;margin-top:10px}.fine{font-size:12px;color:#748a96}@media(max-width:650px){.wrap{padding-inline:14px}.card{padding:20px}}
</style></head><body><div class="wrap"><div class="brand">NEREON</div><p class="eyebrow">PRIVATE CLIENT PORTAL</p><div id="app" class="card"><p>Loading proposal…</p></div></div><script>
(()=>{const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const token=new URLSearchParams(location.search).get('token')||'';if(!token){app.innerHTML='<h2>Invalid link</h2><p class="error">This proposal link is missing its secure token.</p>';return}
async function load(){const r=await fetch('/api/client/proposal?token='+encodeURIComponent(token));const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Could not load proposal.');render(d)}async function loadActivity(){const box=document.getElementById('activity');if(!box)return;try{const r=await fetch('/api/client/activity?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Could not load activity.');const rows=d.events||[];box.innerHTML=rows.length?rows.map(e=>`<div style="padding:10px 0;border-bottom:1px solid #1b2a34"><strong>${esc(e.title)}</strong><span class="fine" style="float:right">${esc(new Date(e.created_at).toLocaleString())}</span><p style="margin:6px 0">${esc(e.detail)}</p></div>`).join(''):'<p>No project activity yet.</p>';}catch(e){box.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
async function loadDeliverables(){const box=document.getElementById('deliverables');if(!box)return;try{const r=await fetch('/api/client/deliverables?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Could not load deliverables.');const rows=d.deliverables||[];box.innerHTML=rows.length?rows.map(x=>`<div style="padding:12px 0;border-bottom:1px solid #1b2a34"><div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap"><strong>${esc(x.title)}</strong><span class="fine">${esc(x.status)}</span></div><p style="margin:6px 0">${esc(x.description||'')}</p>${x.resource_url?`<a href="${esc(x.resource_url)}" target="_blank" rel="noopener noreferrer" class="fine">Open deliverable ↗</a>`:''}</div>`).join(''):'<p>No deliverables yet.</p>';}catch(e){box.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}async function loadProjectCenter(){const box=document.getElementById('projectCenter');if(!box)return;try{const r=await fetch('/api/client/project-center?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Could not load project status.');if(!d.project){box.innerHTML='<p>Your project workspace will appear here after activation.</p>';return}const p=d.project;box.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px"><div style="padding:14px;border:1px solid #22313b;border-radius:14px;background:#101b22"><div class="fine">STATUS</div><strong>${esc(p.status||'—')}</strong></div><div style="padding:14px;border:1px solid #22313b;border-radius:14px;background:#101b22"><div class="fine">PROGRESS</div><strong>${Number(p.progress||0)}%</strong></div><div style="padding:14px;border:1px solid #22313b;border-radius:14px;background:#101b22"><div class="fine">OPEN TASKS</div><strong>${esc(String(p.open_tasks??0))}</strong></div></div><div style="margin-top:14px;padding:14px;border:1px solid #22313b;border-radius:14px;background:#0c161d"><div class="fine">NEXT STEP</div><strong>${esc(p.next_task?.title||'NEREON will update you here.')}</strong>${p.next_task?.detail?`<p style="margin:6px 0 0">${esc(p.next_task.detail)}</p>`:''}</div>`}catch(e){box.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}async function loadMessages(){const box=document.getElementById('messages');if(!box)return;try{const r=await fetch('/api/client/messages?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Could not load messages.');const rows=d.messages||[];box.innerHTML=rows.length?rows.map(m=>`<div style=\"padding:10px 0;border-bottom:1px solid #1b2a34\"><strong>${esc(m.sender_type==='client'?'You':'NEREON')}</strong><span class=\"fine\" style=\"float:right\">${esc(new Date(m.created_at).toLocaleString())}</span><p style=\"margin:6px 0\">${esc(m.message)}</p></div>`).join(''):'<p>No messages yet.</p>';}catch(e){box.innerHTML='<p class=\"error\">'+esc(e.message)+'</p>'}}
async function sendMessage(){const text=(document.getElementById('messageText')?.value||'').trim();const state=document.getElementById('messageState');if(!text){state.textContent='Write a message first.';return}state.textContent='Sending…';try{const r=await fetch('/api/client/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,message:text})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Could not send message.');document.getElementById('messageText').value='';state.textContent='Message sent.';await loadMessages()}catch(e){state.textContent=e.message}}

function render(payload){const p=payload.proposal;const invoice=payload.invoice;const payment=payload.payment;const project=payload.project;const tasks=Array.isArray(payload.tasks)?payload.tasks:[];const items=Array.isArray(p.scope)?p.scope:[];let post='';if(p.status==='accepted'){if(invoice?.status==='paid'){post='<div class="state">✅ Payment received. Thank you.</div>'}else{post='<div class="state"><strong>Next step</strong><p>Your proposal is accepted. A secure Stripe checkout is available below. Card details are entered on Stripe, not on this site.</p><button id="pay">Pay invoice</button><div id="payState"></div></div>'}}else if(p.status==='rejected'){post='<div class="state">This proposal was rejected.</div>'}else{post='<label for="message"><strong>Message for NEREON</strong></label><textarea id="message" placeholder="Questions, requested changes, or context…"></textarea><div class="actions"><button id="accept">Accept proposal</button><button id="changes" class="ghost">Request changes</button></div><div id="state"></div>'} app.innerHTML=`<div class="meta"><span>${esc(p.company)}</span><span>${esc(p.status)}</span><span>${esc(p.timeline)}</span></div><h1>${esc(p.title)}</h1><p>${esc(p.executive_summary)}</p><h2>Scope</h2><ol class="scope">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="meta"><span>Investment</span><span class="price">€${Number(p.price_eur||0).toLocaleString('de-DE')}</span></div>${invoice?`<div class="meta"><span>Invoice</span><span>${esc(invoice.id)}</span><span>${esc(invoice.status)}</span></div>`:''}${p.client_message?`<div class="state"><strong>Latest client note</strong><p>${esc(p.client_message)}</p></div>`:''}<div id="actionArea">${post}</div>${project?`<div class="card" style="margin-top:18px"><div class="eyebrow" style="margin-top:0">PROJECT WORKSPACE</div><h2>${esc(project.name)}</h2><div class="meta"><span>Status: ${esc(project.status)}</span><span>Started: ${esc(project.started_at?new Date(project.started_at).toLocaleDateString(): '—')}</span></div><h3>Project progress</h3><div class="state"><strong>${tasks.filter(t=>t.status==='done').length}/${tasks.length} tasks complete</strong><div style="margin-top:10px;height:8px;background:#12202a;border-radius:99px;overflow:hidden"><div style="width:${tasks.length?Math.round(tasks.filter(t=>t.status==='done').length/tasks.length*100):0}%;height:100%;background:#3be7ff"></div></div></div><ul class="scope">${tasks.map(t=>`<li><strong>${esc(t.title)}</strong> — ${esc(t.status)}${t.detail?`<br><span class="fine">${esc(t.detail)}</span>`:''}</li>`).join('')}</ul></div>`:''}<div class="card" style="margin-top:18px"><div class="eyebrow" style="margin-top:0">PROJECT ACTIVITY</div><h2>Timeline</h2><div id="activity" class="state"><p>Loading activity…</p></div></div><div class="card" style="margin-top:18px"><div class="eyebrow" style="margin-top:0">PROJECT MESSAGES</div><h2>Talk to NEREON</h2><div id="messages" class="state"><p>Loading messages…</p></div><textarea id="messageText" placeholder="Write a message to NEREON…"></textarea><div class="actions"><button id="sendMessage" type="button">Send message</button></div><div id="messageState" class="fine"></div></div><div class="card" style="margin-top:18px"><div class="eyebrow">PROJECT CENTER</div><h2>Your project at a glance</h2><div id="projectCenter" class="state"><p>Loading project status…</p></div></div><div class="card" style="margin-top:18px"><div class="eyebrow" style="margin-top:0">DELIVERABLES</div><h2>Project outputs</h2><div id="deliverables" class="state"><p>Loading deliverables…</p></div></div><p class="fine">This secure link is private. Do not share it publicly. Payment is processed by Stripe when enabled.</p>`;const accept=document.getElementById('accept');const changes=document.getElementById('changes');const pay=document.getElementById('pay');if(accept)accept.onclick=()=>send('accept');if(changes)changes.onclick=()=>send('request_changes');if(pay)pay.onclick=payInvoice;}
async function payInvoice(){const state=document.getElementById('payState');state.textContent='Opening secure payment…';try{const r=await fetch('/api/client/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Could not start payment.');if(!d.checkout_url)throw new Error('Stripe checkout URL missing.');location.href=d.checkout_url}catch(e){state.textContent=e.message}}
async function send(action){const message=(document.getElementById('message')?.value||'').trim();const state=document.getElementById('state');state.textContent='Submitting…';try{const r=await fetch('/api/client/proposal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action,message})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Request failed.');state.innerHTML='<div class="state">✅ '+esc(d.message||'Done.')+'</div>';await load()}catch(e){state.innerHTML='<div class="state error">'+esc(e.message)+'</div>'}}
load().catch(e=>{app.innerHTML='<h2>Proposal unavailable</h2><p class="error">'+esc(e.message)+'</p>'});document.addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('sendMessage');if(b)b.onclick=sendMessage;loadProjectCenter();loadMessages();loadActivity();loadDeliverables()});})();</script></body></html>
